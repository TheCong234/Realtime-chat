# --- 1. Rate Limiting Zones ---
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- 2. Block Bad Bots & Scanners ---
map $http_user_agent $bad_bot {
    default 0;
    ~*(?:curl|wget|python|scrapy|bot|crawler|spider|nikto|sqlmap) 1;
}

# --- 3. HTTP Server (Redirect to HTTPS & ACME Challenge) ---
server {
    listen 80;
    listen [::]:80;
    server_name chat.cloverhand.click;
    
    # Dành cho việc gia hạn SSL sau này
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển hướng mọi traffic khác sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 4. HTTPS Server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.cloverhand.click;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/chat.cloverhand.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.cloverhand.click/privkey.pem;
    
    # SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Lưu ý: wss:// dành cho SignalR qua HTTPS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://chat.cloverhand.click https://chat.cloverhand.click;" always;

    # Block bad bots
    if ($bad_bot) {
        return 403;
    }

    # Connection limits
    limit_conn conn_limit 20;

    # --- Proxy Settings ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A. Frontend (Next.js)
    location / {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://coongchat-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # B. Backend API
    location /api {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://coongchat-backend:5053;
        proxy_http_version 1.1;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # C. Auth Endpoints (Strict limit)
    location ~ ^/api/(auth|login|register) {
        limit_req zone=auth burst=3 nodelay;
        
        proxy_pass http://coongchat-backend:5053;
        proxy_http_version 1.1;
    }

    # D. SignalR Hub (WebSocket)
    # QUAN TRỌNG: Kiểm tra trong code .NET Hub được map là /hubs hay /chatHub
    location /hubs {
        limit_req zone=general burst=10 nodelay;
        
        proxy_pass http://coongchat-backend:5053;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout dài cho kết nối chat không bị ngắt giữa chừng
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # E. Static files (Uploads)
    location /uploads {
        limit_req zone=general burst=30 nodelay;
        
        proxy_pass http://coongchat-backend:5053;
        
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # F. Health check
    location /health {
        proxy_pass http://coongchat-backend:5053;
    }

    # G. Block sensitive files
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }
}