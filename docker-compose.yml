services:
  # MS SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coongchat-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID:-Express}
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - coongchat-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # .NET Backend API
  backend:
    build:
      context: ./server/CoongChat
      dockerfile: Dockerfile
    container_name: coongchat-backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=CoongChatDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-coongchat.api}
      - Jwt__Audience=${JWT_AUDIENCE:-coongchat.client}
      - Jwt__AccessTokenMinutes=${JWT_ACCESS_TOKEN_MINUTES:-1440}
      - Jwt__RefreshTokenDays=${JWT_REFRESH_TOKEN_DAYS:-7}
      - FileStorage__UploadPath=wwwroot/uploads
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedOrigins__0=https://chat.cloverhand.click
      - AllowedOrigins__1=http://localhost:3000
    expose:
      - "5053"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    networks:
      - coongchat-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:5053/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Next.js Frontend - SECURED
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://chat.cloverhand.click
    container_name: coongchat-frontend
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - coongchat-network
    depends_on:
      - backend
    restart: unless-stopped
    # SECURITY: Strict resource limits to prevent abuse
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # SECURITY: Read-only filesystem where possible
    read_only: true
    tmpfs:
      - /tmp
    # SECURITY: Drop all capabilities
    cap_drop:
      - ALL
    # SECURITY: No new privileges
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: coongchat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - coongchat-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: coongchat-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  coongchat-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  uploads_data:
    driver: local
