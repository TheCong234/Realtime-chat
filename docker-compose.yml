version: '3.8'

services:
  # MS SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coongchat-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong!Passw0rd123}
      - MSSQL_PID=${MSSQL_PID:-Express}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - coongchat-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # .NET Backend API
  backend:
    build:
      context: ./server/CoongChat
      dockerfile: Dockerfile
    container_name: coongchat-backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=CoongChatDB;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd123};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY:-COONGCHAT_SUPER_SECRET_KEY_123456789_DOCKER}
      - Jwt__Issuer=${JWT_ISSUER:-coongchat.api}
      - Jwt__Audience=${JWT_AUDIENCE:-coongchat.client}
      - Jwt__AccessTokenMinutes=${JWT_ACCESS_TOKEN_MINUTES:-1440}
      - Jwt__RefreshTokenDays=${JWT_REFRESH_TOKEN_DAYS:-7}
      - FileStorage__UploadPath=wwwroot/uploads
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5053:5053"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    networks:
      - coongchat-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:5053/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5053}
    container_name: coongchat-frontend
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3000"
    networks:
      - coongchat-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  coongchat-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  uploads_data:
    driver: local
